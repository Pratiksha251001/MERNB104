<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register With Me</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e7f0ff;
        }

        .registerBox {
            width: 850px;
            max-width: 90%;
            display: flex;
            overflow: hidden;
            border-radius: 30px 8px 30px 8px;
            background-color: white;
            box-shadow: 0 8px 25px #9bb4d3;
        }

        .welcomeSide {
            width: 42%;
            padding: 70px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #263b80;
            color: white;
            border-radius: 0 90px 90px 0;
        }

        .welcomeSide h1 {
            margin-bottom: 15px;
            font-size: 32px;
        }

        .welcomeSide p {
            line-height: 1.6;
            color: #dce5ff;
        }

        .formSide {
            width: 58%;
            padding: 45px 60px;
        }

        .formSide h2 {
            margin-bottom: 18px;
            color: #263b80;
            text-align: center;
        }

        .googleButton {
            width: 100%;
            padding: 11px;
            border: 1px solid #b8c5e0;
            border-radius: 20px;
            background-color: white;
            color: #263b80;
            font-size: 15px;
            cursor: pointer;
        }

        .googleButton:hover {
            background-color: #edf2ff;
        }

        .orText {
            margin: 18px 0;
            color: #777;
            text-align: center;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            color: #263b80;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 2px solid #b8c5e0;
            outline: none;
            background-color: #f3f6fc;
        }

        input:focus {
            border-bottom-color: #e66c8c;
        }

        .registerButton {
            display: block;
            margin: 25px auto 0;
            padding: 12px 35px;
            border: none;
            border-radius: 20px 5px 20px 5px;
            background-color: #e66c8c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .registerButton:hover {
            background-color: #c94f70;
        }

        @media screen and (max-width: 650px) {
            .registerBox {
                display: block;
            }

            .welcomeSide,
            .formSide {
                width: 100%;
            }

            .welcomeSide {
                padding: 30px;
                border-radius: 0 0 50px 50px;
            }

            .formSide {
                padding: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="registerBox">
        <section class="welcomeSide">
            <h1>Welcome!</h1>
            <p>Create your account and join me to explore my portfolio and projects.</p>
        </section>

        <section class="formSide">
            <h2>Register With Me</h2>
            <button class="googleButton" type="button">G&nbsp;&nbsp; Continue with Google</button>
            <p class="orText">OR</p>

            <form action="" method="post">
                <label for="nameInput">Name</label>
                <input type="text" id="nameInput" name="name" placeholder="Enter your name" required>

                <label for="emailInput">Email</label>
                <input type="email" id="emailInput" name="email" placeholder="Enter your email" required>

                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" name="password" placeholder="Create a password" required>

                <button class="registerButton" type="submit">REGISTER</button>
            </form>
        </section>
    </main>
</body>

</html>
